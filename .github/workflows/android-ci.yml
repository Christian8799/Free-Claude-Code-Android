name: Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Manual Android SDK setup - bypass broken setup-android action
      - name: Set up Android SDK
        run: |
          # Use pre-installed SDK on ubuntu-latest
          if [ -d "/usr/local/lib/android/sdk" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
            echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
            echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          else
            # Fallback: install cmdline-tools manually
            sudo mkdir -p /opt/android-sdk/cmdline-tools
            cd /opt/android-sdk/cmdline-tools
            sudo wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
            sudo unzip -q cmdline-tools.zip
            sudo mv cmdline-tools latest
            sudo rm cmdline-tools.zip
            echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
            echo "/opt/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
            echo "/opt/android-sdk/platform-tools" >> $GITHUB_PATH
          fi
          echo "Android SDK location: $ANDROID_HOME"
          ls -la $ANDROID_HOME/

      - name: Accept licenses and install packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.kts', '**/*.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Show build log on failure
        if: failure()
        run: cat build.log

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7